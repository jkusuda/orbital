name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test ./...

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.75.0

      # Fails if engine.proto changed but `buf generate` wasn't re-run.
      - name: Lint proto and check generated code is up to date
        working-directory: proto
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          buf lint
          buf generate
          git diff --exit-code -- ../backend/internal/gen

  # On pushes to main, build the three images and publish them to GitHub's
  # container registry. The server pulls these instead of building (it's tiny).
  images:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            file: backend/Dockerfile
          - name: engine
            context: .
            file: engine/Dockerfile
          - name: web
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orbital-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/orbital-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
